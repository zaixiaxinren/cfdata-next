services:
  cfdata-next:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfdata-next:local
    container_name: cfdata-next
    restart: unless-stopped
    ports:
      - "13335:13335"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - CFDATA_DATA_DIR=/data
    # 需要 Web 登录时把 -user / -password 加上，例如：
    #   command: ["-host","0.0.0.0","-port","13335","-user","admin","-password","改成你的密码"]
    command: ["-host", "0.0.0.0", "-port", "13335", "-dns", "223.5.5.5,8.8.8.8"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
