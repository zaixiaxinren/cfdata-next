# 与 docker-compose.yml 相同，但使用 host 网络：
# 需要扫描/测速 IPv6 地址时必须用这个，否则容器内没有 IPv6 出口。
services:
  cfdata-next:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfdata-next:local
    container_name: cfdata-next
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - CFDATA_DATA_DIR=/data
    command: ["-host", "0.0.0.0", "-port", "13335", "-dns", "223.5.5.5,8.8.8.8"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
